<title>Beep's Crate Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen 3D world; the interface floats on top like chunky toy pieces.
   Four garden moods (morning, noon, sunset, starlight) recolour the sky and the accent colour. */
/*FONT*/
@property --sky-top { syntax: '<color>'; inherits: true; initial-value: #4fb3f6; }
@property --sky-mid { syntax: '<color>'; inherits: true; initial-value: #a5dcfb; }
@property --sky-low { syntax: '<color>'; inherits: true; initial-value: #e6f8ff; }
:root {
  --sky-top: #4fb3f6; --sky-mid: #a5dcfb; --sky-low: #e6f8ff;
  --accent: #ffb21e; --accent-deep: #d98600;
  --ink: #2b2a55;
  --muted: #6f7396;
  --panel: #ffffff;
  --edge: rgba(43, 42, 85, 0.22);
  --sun: #ffbf1f; --sun-deep: #e08e00;
  --leaf: #39b85a; --leaf-deep: #23893f;
  --berry: #ff5f7a; --berry-deep: #d63a57;
  --star-off: #dcdff0;
  --font: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
  transition: --sky-top 1.2s, --sky-mid 1.2s, --sky-low 1.2s;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; font-family: var(--font); font-weight: 500; color: var(--ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas.dragging { cursor: grabbing; }
svg.i { width: 1em; height: 1em; flex: none; display: block; }

/* ---------- buttons ---------- */
button { font: inherit; color: inherit; border: 0; cursor: pointer; padding: 0; background: none; }
.btn {
  --bg: var(--panel); --lip: var(--edge);
  position: relative; background: var(--bg); color: var(--ink);
  border-radius: 20px; min-height: 56px; min-width: 56px; padding: 0 18px;
  font-weight: 600; font-size: 19px; letter-spacing: 0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 5px 0 var(--lip), 0 10px 18px rgba(43, 42, 85, 0.16);
  transition: transform 0.07s, box-shadow 0.07s, filter 0.15s;
}
.btn svg.i { font-size: 26px; }
.btn:active, .btn.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--lip), 0 3px 6px rgba(43, 42, 85, 0.16); }
.btn:focus-visible { outline: 4px solid #fff; outline-offset: 2px; box-shadow: 0 5px 0 var(--lip), 0 0 0 8px var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.round { border-radius: 50%; padding: 0; }
.btn.green { --bg: var(--leaf); --lip: var(--leaf-deep); color: #fff; }
.btn.sun { --bg: var(--sun); --lip: var(--sun-deep); color: #fff; }
.btn.big { min-height: 72px; font-size: 28px; padding: 0 36px; border-radius: 26px; font-weight: 700; }
.btn.big svg.i { font-size: 30px; }
.btn .key {
  font-size: 12px; font-weight: 600; color: var(--muted); border: 2px solid #d9dcec; border-bottom-width: 3px;
  border-radius: 7px; padding: 0 6px; line-height: 18px; background: #fff;
}
.btn[aria-pressed="false"] { color: #a9adc6; }
body.touch .key { display: none; }

/* ---------- HUD ---------- */
.hud { position: fixed; z-index: 5; display: flex; gap: 10px; align-items: center; transition: opacity 0.35s, transform 0.35s; }
body.title .hud, body.title .tip { opacity: 0; pointer-events: none !important; }
body.title .hud * { pointer-events: none !important; }
body.title .top { transform: translateY(-30px); }
body.title .dpad, body.title .turns { transform: translateY(30px); }
.top {
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  justify-content: space-between; align-items: flex-start; pointer-events: none;
}
.top > * { pointer-events: auto; }
.info { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.pill {
  background: var(--panel); border-radius: 22px; padding: 8px 18px 8px 8px; min-height: 60px; box-sizing: border-box;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 5px 0 var(--edge), 0 10px 18px rgba(43, 42, 85, 0.16);
}
.lvnum {
  font-weight: 700; font-size: 26px; line-height: 1; color: #fff; background: var(--accent);
  border-radius: 16px; min-width: 46px; height: 46px; display: grid; place-items: center;
  box-shadow: inset 0 -4px 0 var(--accent-deep); text-shadow: 0 2px 0 var(--accent-deep);
  transition: background 0.6s, box-shadow 0.6s;
}
.lvname { font-weight: 600; font-size: 20px; line-height: 1.1; white-space: nowrap; }
.homerow { display: flex; gap: 4px; margin-top: 5px; }
.homerow i {
  width: 18px; height: 18px; border-radius: 5px; box-sizing: border-box; display: block;
  border: 2.5px solid #c9a06a; background: #f3dfc0; transition: background 0.25s, border-color 0.25s, transform 0.25s;
}
.homerow i.on { background: var(--sun); border-color: var(--sun-deep); transform: scale(1.12); }
.score { padding: 6px 16px 6px 16px; gap: 14px; }
.pushes { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.pushes b { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.3em; text-align: center; display: block; }
.pushes b.tick { animation: tick 0.22s; }
@keyframes tick { 40% { transform: scale(1.3); color: var(--accent-deep); } }
.pushes span, .goal { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.meter { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.stars3 { display: flex; gap: 2px; font-size: 24px; color: var(--sun); }
.stars3 svg.i { transition: color 0.3s, transform 0.3s; filter: drop-shadow(0 2px 0 rgba(224, 142, 0, 0.55)); }
.stars3 svg.off { color: var(--star-off); transform: scale(0.82); filter: none; }
.goal { text-transform: none; letter-spacing: 0.01em; font-size: 13px; white-space: nowrap; }
.goal b { color: var(--ink); }

.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.turns { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
.turns .btn { width: 64px; height: 64px; }
.turns .btn svg.i { font-size: 32px; }
.turns .key { position: absolute; top: -6px; right: -4px; }

.dpad {
  left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: none; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px); gap: 0;
  padding: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.45);
}
body.touch .dpad { display: grid; }
.dpad .btn { width: 66px; height: 66px; min-width: 0; min-height: 0; margin: 3px; padding: 0; border-radius: 22px; }
.dpad .btn svg.i { font-size: 36px; }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.dpad .hub { grid-area: 2 / 2; margin: auto; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); }

.tip {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  background: var(--ink); color: #fff; border-radius: 20px; padding: 12px 20px; font-size: 17px; line-height: 1.5; text-align: center;
  max-width: min(520px, calc(100% - 32px)); box-sizing: border-box; transition: opacity 0.6s;
  box-shadow: 0 10px 22px rgba(43, 42, 85, 0.3);
}
.tip kbd { font: inherit; font-weight: 600; font-size: 14px; border-radius: 7px; padding: 1px 7px; margin: 0 1px; background: #fff; color: var(--ink); box-shadow: 0 2px 0 #b9bdd8; }
.tip b { color: var(--sun); font-weight: 600; }
body.touch .tip { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 96px); }

/* level name banner */
.banner {
  position: fixed; z-index: 6; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none;
  color: #fff; opacity: 0;
}
.banner.show { animation: banner 2.4s both; }
@keyframes banner {
  0% { opacity: 0; transform: translateY(18px) scale(0.9); } 12% { opacity: 1; transform: none; }
  75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px); }
}
.banner small {
  display: inline-block; font-size: 18px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--accent); border-radius: 999px; padding: 4px 16px; box-shadow: 0 3px 0 var(--accent-deep);
}
.banner div { font-size: clamp(34px, 6.5vw, 60px); font-weight: 700; line-height: 1.1; margin-top: 8px; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }

/* ---------- title screen ---------- */
.title {
  position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 4vh) 16px calc(env(safe-area-inset-bottom, 0px) + 5vh);
  pointer-events: none; transition: opacity 0.4s;
}
.title > * { pointer-events: auto; }
.title.out { opacity: 0; }
.title.out > * { pointer-events: none; }
.logo { text-align: center; line-height: 0.92; animation: logoIn 0.8s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes logoIn { from { transform: translateY(-40px) scale(0.7); opacity: 0; } }
.logo .small {
  display: inline-block; font-size: clamp(22px, 4vw, 38px); font-weight: 700; color: #fff; background: var(--berry);
  padding: 8px 22px 9px; border-radius: 999px; transform: rotate(-4deg); box-shadow: 0 5px 0 var(--berry-deep); margin-bottom: 10px;
}
.logo .big {
  display: block; font-size: clamp(50px, 10.5vw, 112px); font-weight: 700; color: #fff; letter-spacing: 0.005em;
  -webkit-text-stroke: clamp(10px, 1.8vw, 18px) var(--ink); paint-order: stroke fill;
  text-shadow: 0 clamp(6px, 1vw, 10px) 0 var(--ink);
}
.logo .big em { font-style: normal; color: var(--sun); }
.title .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: actionsIn 0.6s 0.25s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes actionsIn { from { transform: translateY(40px); opacity: 0; } }
.title .play { min-width: 240px; animation: breathe 1.8s 1.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.05); } }
.title .play:active { animation: none; }
.title .rowb { display: flex; gap: 12px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 6px 16px 6px 12px; white-space: nowrap;
  font-weight: 600; font-size: 18px; box-shadow: 0 4px 0 var(--edge);
}
.chip svg.i { color: var(--sun); font-size: 22px; filter: drop-shadow(0 2px 0 rgba(224, 142, 0, 0.55)); }

/* ---------- overlays / cards ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: auto;
  background: rgba(43, 42, 85, 0.42); animation: fade 0.25s both;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box;
}
.overlay.soft { background: rgba(43, 42, 85, 0.12); place-items: end center; padding-bottom: max(4vh, calc(env(safe-area-inset-bottom, 0px) + 16px)); }
@keyframes fade { from { opacity: 0; } }
.card {
  position: relative; background: #fff; border-radius: 34px; padding: 26px; text-align: center; width: min(440px, 100%); box-sizing: border-box;
  box-shadow: 0 9px 0 rgba(43, 42, 85, 0.25), 0 24px 50px rgba(43, 42, 85, 0.3);
  animation: pop 0.45s cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes pop { from { transform: scale(0.6) translateY(30px); opacity: 0; } }
.card h2 { font-weight: 700; font-size: 34px; margin: 0; line-height: 1.05; text-wrap: balance; }
.card .row { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
.card .btn { --bg: #eef0fa; --lip: #cfd3e8; box-shadow: 0 5px 0 var(--lip); }
.card .btn:active { box-shadow: 0 1px 0 var(--lip); }
.card .btn.green { --bg: var(--leaf); --lip: var(--leaf-deep); }

/* win card */
.win { padding-top: 58px; margin-top: 40px; }
.ribbon {
  position: absolute; left: 50%; top: -30px; transform: translateX(-50%) rotate(-2deg); white-space: nowrap;
  background: var(--berry); color: #fff; font-weight: 700; font-size: clamp(28px, 7vw, 38px); line-height: 1; padding: 14px 34px 16px; border-radius: 22px;
  box-shadow: 0 6px 0 var(--berry-deep);
}
.winstars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; color: var(--star-off); margin: 6px 0 4px; }
.winstars svg.i { font-size: 78px; }
.winstars svg.i:nth-child(2) { font-size: 100px; margin-bottom: 10px; }
.winstars svg.on { color: var(--sun); filter: drop-shadow(0 5px 0 var(--sun-deep)); animation: starIn 0.5s cubic-bezier(.2, 1.8, .4, 1) both; }
.winstars svg.on:nth-child(1) { animation-delay: 0.3s; } .winstars svg.on:nth-child(2) { animation-delay: 0.65s; } .winstars svg.on:nth-child(3) { animation-delay: 1s; }
@keyframes starIn { from { transform: scale(0) rotate(-140deg); color: var(--star-off); filter: none; } }
.wintext { font-size: 22px; font-weight: 600; margin: 8px 0 2px; }
.wintext b { font-weight: 700; color: var(--leaf-deep); font-size: 26px; }
.winhint { font-size: 16px; color: var(--muted); margin: 0 0 20px; min-height: 1.3em; }
.newbest { display: inline-block; background: var(--sun); color: #fff; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 2px 12px; margin-left: 6px; vertical-align: 3px; box-shadow: 0 3px 0 var(--sun-deep); animation: starIn 0.5s 1.3s cubic-bezier(.2, 1.8, .4, 1) both; }
.win .row .btn.round { width: 60px; height: 60px; }

/* gardens card */
.gardens { width: min(640px, 100%); padding: 22px 22px 18px; }
.gardens .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.gardens .head h2 { text-align: left; }
.gardens .chip { box-shadow: none; background: #fff6d8; }
.gardens .btn.close { width: 48px; height: 48px; min-width: 0; min-height: 0; }
.zone { margin-top: 12px; border-radius: 22px; padding: 10px 12px 14px; background: var(--zbg); }
.zone h3 { margin: 0 0 8px 4px; font-size: 16px; font-weight: 600; text-align: left; color: var(--zink); display: flex; gap: 8px; align-items: center; }
.zone h3 span { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--zink); color: #fff; border-radius: 999px; padding: 1px 9px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.grid .btn {
  --bg: #fff; --lip: var(--zlip); min-width: 0; min-height: 68px; padding: 6px 0 4px; flex-direction: column; gap: 2px;
  font-size: 26px; font-weight: 700; line-height: 1; border-radius: 18px;
}
.grid .btn .s { display: flex; gap: 1px; font-size: 15px; color: var(--star-off); }
.grid .btn .s .on { color: var(--sun); }
.grid .btn.done { --bg: var(--zc); --lip: var(--zdeep); color: #fff; text-shadow: 0 2px 0 var(--zdeep); }
.grid .btn.done .s { color: rgba(255, 255, 255, 0.45); }
.grid .btn.done .s .on { color: #fff3b0; }
.grid .btn.cur { outline: 4px solid var(--ink); outline-offset: 2px; }
.gardens .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.gardens .foot .btn { min-height: 48px; font-size: 16px; padding: 0 14px; }
.gardens .foot .btn svg.i { font-size: 22px; }
.credit { font-size: 12px; color: var(--muted); margin-top: 12px; font-weight: 400; }
.credit a { color: inherit; }

/* ---------- loading ---------- */
#loading {
  position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; z-index: 20;
  background: linear-gradient(180deg, #4fb3f6, #e6f8ff); font-size: 26px; font-weight: 600; color: #fff; text-shadow: 0 3px 0 rgba(43, 42, 85, 0.3);
  transition: opacity 0.5s;
}
#loading i { width: 64px; height: 64px; border-radius: 16px; background: #e8a04c; border: 7px solid #b96f2c; box-sizing: border-box; animation: hop 0.7s cubic-bezier(.3, 0, .6, 1) infinite alternate; }
@keyframes hop { from { transform: translateY(10px) scale(1.08, 0.9); } to { transform: translateY(-34px) rotate(12deg); } }

/* ---------- small screens ---------- */
@media (max-width: 860px) {
  .btn .label, .btns .key { display: none; }
  .btns .btn { padding: 0; }
}
@media (max-width: 640px), (max-height: 520px) {
  .btn { min-height: 48px; min-width: 48px; border-radius: 16px; }
  .btn svg.i { font-size: 22px; }
  .btns { gap: 7px; max-width: 170px; }
  .pill { min-height: 52px; border-radius: 18px; padding: 6px 12px 6px 6px; gap: 8px; }
  .lvnum { min-width: 40px; height: 40px; font-size: 22px; border-radius: 13px; }
  .lvname { font-size: 16px; }
  .score { padding: 4px 12px; gap: 10px; }
  .pushes b { font-size: 24px; }
  .stars3 { font-size: 19px; }
  .dpad { grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); }
  .dpad .btn { width: 54px; height: 54px; border-radius: 18px; }
  .turns .btn { width: 54px; height: 54px; }
  .grid { gap: 7px; } .grid .btn { min-height: 56px; font-size: 22px; } .grid .btn .s { font-size: 12px; }
  .gardens { padding: 16px 14px 14px; } .card h2 { font-size: 26px; }
  .winstars svg.i { font-size: 60px; } .winstars svg.i:nth-child(2) { font-size: 78px; }
}
@media (max-height: 520px) {
  .title { flex-direction: row; align-items: center; justify-content: space-around; }
  .win { padding-top: 40px; } .winhint { margin-bottom: 12px; }
  .zone { margin-top: 8px; padding: 6px 10px 10px; } .grid .btn { min-height: 46px; flex-direction: row; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .logo, .title .actions, .title .play, .winstars svg.on, .newbest, #loading i { animation: none; }
}
</style>

function parseLevel(map) {
  const H = map.length, W = Math.max(...map.map((r) => r.length));
  const walls = new Set(), goals = new Set(), boxes = []; let p = null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = map[y][x] || ' ', k = y * W + x;
    if (c === '#') walls.add(k);
    if ('.*+'.includes(c)) goals.add(k);
    if ('$*'.includes(c)) boxes.push(k);
    if ('@+'.includes(c)) p = k;
  }
  // floor = everything the worker could ever reach (flood fill from start through non-walls)
  const floor = new Set([p]), stack = [p];
  while (stack.length) {
    const c = stack.pop(), x = c % W, y = (c / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const n = ny * W + nx; if (walls.has(n) || floor.has(n)) continue; floor.add(n); stack.push(n);
    }
  }
  // hedges = walls that touch the floor (also diagonally)
  const hedges = new Set();
  for (const k of walls) {
    const x = k % W, y = (k / W) | 0;
    search: for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (floor.has(ny * W + nx)) { hedges.add(k); break search; }
    }
  }
  return { W, H, walls, goals, boxes, p, floor, hedges };
}

  }
  const shrooms = instanced(GEO.mushroom, M(0xffffff, { vertexColors: true, roughness: 0.6 }), 5);
  for (let n = 0; n < 5; n++) { const p = spot(0.15, 0.5, 0.92); if (p) put(shrooms, p[0], GROUND, p[1], 0.9 + rnd() * 0.8, rnd() * 6); }
  const rocks = instanced(GEO.rockBit, M(0xb9b4c4, { flatShading: true }), 6);
  for (let n = 0; n < 6; n++) { const p = spot(0.2, 0.5, 0.95); if (p) put(rocks, p[0], GROUND + 0.03, p[1], 0.1 + rnd() * 0.12, rnd() * 6, null, 0.07 + rnd() * 0.08); }
  const treeSpots = [];
  for (let n = 0; n < 4; n++) {
    const p = spot(0.75, 0.6, 0.88); if (!p || treeSpots.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 1.6)) continue;
    treeSpots.push(p);
    const tr = makeTree(th, rnd); tr.position.set(p[0], GROUND, p[1]); tr.rotation.y = rnd() * 6; tr.scale.setScalar(0.85 + rnd() * 0.35);
    world.add(tr); const ph = rnd() * 6; ambient.push({ tick: (t) => { tr.rotation.z = Math.sin(t * 1.1 + ph) * 0.025; tr.rotation.x = Math.cos(t * 0.9 + ph) * 0.02; } });
  }
  { // a little wooden sign with the garden number
    const sx = -(W / 2 + 0.75), sz = H / 2 + 0.75;
    const s = makeSign(i + 1, th); s.position.set(sx, GROUND, sz); s.rotation.y = 0.9; world.add(s);
  }

  // clouds drifting around and below, and a few far-away islands
  const cloudMat = own(new THREE.MeshLambertMaterial({ color: th.cloud }));
  const R = Math.hypot(W, H) / 2 + 2;
  for (let n = 0; n < 12; n++) {
    const c = new THREE.Mesh(GEO.cloud, cloudMat); const s = 0.7 + rnd() * 1.1; c.scale.setScalar(s);
    const a0 = rnd() * Math.PI * 2, r = R + 5 + rnd() * 14, y = -3.5 - rnd() * 7, sp = (0.012 + rnd() * 0.02) * (rnd() < 0.5 ? 1 : -1), ph = rnd() * 6;
    world.add(c); ambient.push({ tick: (t) => { const a = a0 + t * sp; c.position.set(Math.cos(a) * r, y + Math.sin(t * 0.4 + ph) * 0.25, Math.sin(a) * r); c.rotation.y = -a; } });
  }
  for (let n = 0; n < 3; n++) {
    const g = new THREE.Group(), s = 1.2 + rnd() * 1.3;
    const capm = new THREE.Mesh(own(new THREE.CylinderGeometry(1, 0.9, 0.3, 9)), M(th.grass[0])); capm.position.y = -0.15;
    const und = new THREE.Mesh(GEO.cone, M(th.rock, { flatShading: true })); und.scale.set(0.9, 1.6, 0.9); und.rotation.x = Math.PI; und.position.y = -1.1;
    const tr = makeTree(th, rnd); tr.scale.setScalar(0.9); tr.position.set(0.2, 0, -0.1);
    g.add(capm, und, tr); g.scale.setScalar(s);
    const a = (n / 3) * Math.PI * 2 + rnd() * 1.2, r = R + 9 + rnd() * 7, y = -3 - rnd() * 4, ph = rnd() * 6;
    g.position.set(Math.cos(a) * r, y, Math.sin(a) * r); world.add(g);
    ambient.push({ tick: (t) => { g.position.y = y + Math.sin(t * 0.5 + ph) * 0.35; } });
  }

  // butterflies by day, fireflies by night
  if (th.critter === 'butterfly' && !reduceMotion) {
    for (let n = 0; n < 3; n++) {
      const g = new THREE.Group(), wm = own(new THREE.MeshBasicMaterial({ color: th.flowers[1 + (n % 3)], side: THREE.DoubleSide }));
      const wl = new THREE.Mesh(GEO.wing, wm), wr = new THREE.Mesh(GEO.wing, wm); wr.scale.x = -1; g.add(wl, wr); g.scale.setScalar(0.7);
      const ph = rnd() * 6, rx = W / 2 + 0.6, rz = H / 2 + 0.6, sp = 0.25 + rnd() * 0.2;
      world.add(g); ambient.push({ tick: (t) => {
        const a = t * sp + ph, x = Math.sin(a) * rx * Math.cos(a * 0.37 + ph), z = Math.cos(a * 0.83) * rz;
        g.rotation.y = Math.atan2(x - g.position.x, z - g.position.z) - Math.PI / 2;
        g.position.set(x, 0.9 + Math.sin(t * 2.1 + ph) * 0.25, z);
        const f = Math.sin(t * 16 + ph) * 0.9; wl.rotation.z = f; wr.rotation.z = -f;
      } });
    }
  }
  if (th.critter === 'firefly') {
    const fm = own(new THREE.MeshBasicMaterial({ color: 0xfff7a8, fog: false }));
    for (let n = 0; n < 16; n++) {
      const f = new THREE.Mesh(GEO.ballLow, fm), p = spot(0, 0.2, 0.95) || [0, 0], ph = rnd() * 6, h = 0.35 + rnd() * 0.9;
      world.add(f); ambient.push({ tick: (t) => {
        f.position.set(p[0] + Math.sin(t * 0.7 + ph) * 0.35, h + Math.sin(t * 1.3 + ph * 2) * 0.18, p[1] + Math.cos(t * 0.6 + ph) * 0.35);
        f.scale.setScalar(0.028 + 0.022 * Math.max(0, Math.sin(t * 2.4 + ph)));
      } });
    }
  }

  // worker
  const pk = L.p;
  player.gx = pk % W; player.gy = (pk / W) | 0;
  player.rail.set(cx(player.gx), 0, cz(player.gy));
  player.obj.position.copy(player.rail); player.vel.set(0, 0, 0);
  player.yaw = player.targetYaw = 0; player.moving = null; player.bump = null; player.spin = 0;
  world.add(player.obj);

  // light & shadow fit
  const S = Math.max(W, H) / 2 + 3.2;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 0.5, far: 60 });
  sun.shadow.camera.updateProjectionMatrix();

  history = []; steps = 0; pushes = 0; won = false;
  buffered = null;
  cam.fit = Math.max(W, H * 1.1);
  const dist = cam.fit * 1.45 + 3.5; scene.fog.near = dist + 6; scene.fog.far = dist + 46;
  if (!opts.quick) { intro = reduceMotion ? 1 : 0; cam.yaw = cam.targetYaw - 0.5; cam.zoom = cam.targetZoom * 1.25; }
  updateCrateFlags(true);
  updateHud();
  $('winBox').hidden = true; winShown = false;
  store.set('level', i);
  if (mode === 'play' && !opts.quick) { showBanner(); sfx.whoosh(); }
  showTip();
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- worker ----------
function makePlayer() {
  const g = models.character;
  const obj = g.scene;
  const box = new THREE.Box3().setFromObject(obj);
  const s = 0.95 / (box.max.y - box.min.y);
  const holder = new THREE.Group();
  obj.scale.setScalar(s);
  holder.add(obj);
  const mixer = new THREE.AnimationMixer(obj);
  const clip = (n) => mixer.clipAction(g.animations.find((a) => a.name === n));
  const actions = { idle: clip('idle'), walk: clip('walk'), jump: clip('jump') };
  actions.idle.play();
  actions.walk.play(); actions.walk.setEffectiveWeight(0);
  actions.jump.setLoop(THREE.LoopOnce); actions.jump.clampWhenFinished = false;
  return { obj: holder, body: obj, mixer, actions, gx: 0, gy: 0, rail: new THREE.Vector3(), vel: new THREE.Vector3(),
    yaw: 0, targetYaw: 0, moving: null, bump: null, walkW: 0, spin: 0 };
}

// ---------- rules (grid based, push only, one crate at a time) ----------
const crateAt = (k) => crates.find((c) => c.key === k);
const STEP_TIME = 0.2, PUSH_TIME = 0.26;
let buffered = null;           // a direction tapped while moving
const held = [];               // directions held down, newest last

function screenDirToGrid(dir) {
  // forward on the ground = away from the camera
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  let vx = 0, vz = 0;
  if (dir === 'up') { vx = fx; vz = fz; } else if (dir === 'down') { vx = -fx; vz = -fz; }
  else if (dir === 'right') { vx = rx; vz = rz; } else { vx = -rx; vz = -rz; }
  return Math.abs(vx) > Math.abs(vz) ? [Math.sign(vx), 0] : [0, Math.sign(vz)];
}

function tryStep(dir, carry = 0) {
  if (won) return false;
  const [dx, dy] = screenDirToGrid(dir);
  const { W, walls } = L;
  const nx = player.gx + dx, ny = player.gy + dy, nk = ny * W + nx;
  player.targetYaw = Math.atan2(dx, dy);
  if (walls.has(nk)) { blocked(dx, dy); return false; }
  const crate = crateAt(nk);
  if (crate) {
    const bk = (ny + dy) * W + (nx + dx);
    if (walls.has(bk) || crateAt(bk)) { blocked(dx, dy); return false; }
    history.push({ p: player.gy * W + player.gx, c: crate.id, ck: crate.key });
    crate.from = crate.obj.position.clone(); crate.from.y = 0;
    crate.key = bk;
    crate.to = new THREE.Vector3(cx(nx + dx), 0, cz(ny + dy));
    crate.drop = 0;
    pushes++; sfx.push(); tickPushes();
  } else {
    history.push({ p: player.gy * W + player.gx, c: -1 });
    sfx.step();
  }
  steps++;
  puff(player.rail, crate ? 3 : 1);
  player.moving = { from: player.rail.clone(), to: new THREE.Vector3(cx(nx), 0, cz(ny)), t: carry, dur: crate ? PUSH_TIME : STEP_TIME, crate };
  player.gx = nx; player.gy = ny;
  updateHud();
  return true;
}

function blocked(dx, dy) {
  if (!player.bump) { player.bump = { dx, dy, t: 0 }; sfx.bump(); }
}

function finishMotion() {
  if (player.moving) {
    player.rail.copy(player.moving.to);
    const c = player.moving.crate;
    if (c) { c.obj.position.copy(c.to); c.from = c.to = null; }
    player.moving = null;
    updateCrateFlags(false);
  }
}

function undo() {
  if (!history.length || won) return;
  finishMotion();
  const h = history.pop();
  const { W } = L;
  player.gx = h.p % W; player.gy = (h.p / W) | 0;
  player.rail.set(cx(player.gx), 0, cz(player.gy));
  if (h.c >= 0) {
    const c = crates[h.c]; c.key = h.ck;
    c.obj.position.set(cx(h.ck % W), 0, cz((h.ck / W) | 0)); c.pop = 0.6; c.drop = 0;
    pushes--; tickPushes();
  }
  steps--;
  sfx.undo();
  updateCrateFlags(true);
  updateHud();
}

function updateCrateFlags(silent) {
  let homeNow = 0;
  for (const c of crates) {
    const on = L.goals.has(c.key);
    if (on && !c.onGoal && !silent) { c.pop = 1; sfx.home(); sparkle(c.obj.position); }
    if (on !== c.onGoal || silent) c.mat.map = on ? crateHome : crateWood;
    c.onGoal = on; if (on) homeNow++;
  }
  for (const p of pads) p.filled = crates.some((c) => c.key === p.key) ? 1 : 0;
  if (!silent && homeNow === crates.length && !won) win();
}

function tickPushes() { const el = $('pushes'); el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
function updateHud() {
  $('lvnum').textContent = levelIndex + 1;
  $('lvname').textContent = LEVELS[levelIndex].name;
  $('par').textContent = LEVELS[levelIndex].parPushes;
  $('pushes').textContent = pushes;
  const home = crates.filter((c) => L.goals.has(c.key)).length;
  $('homeRow').innerHTML = crates.map((_, n) => `<i class="${n < home ? 'on' : ''}"></i>`).join('');
  $('homeRow').setAttribute('aria-label', `Crates home: ${home} of ${crates.length}`);
  const st = starsFor(levelIndex, pushes);
  $('hudStars').innerHTML = [0, 1, 2].map((n) => `<svg class="i ${n < st ? '' : 'off'}"><use href="#i-star"/></svg>`).join('');
  $('hudStars').setAttribute('aria-label', `${st} stars so far`);
  $('undoBtn').disabled = !history.length;
}

function starsFor(i, s) {
  const par = LEVELS[i].parPushes;
  return s <= par ? 3 : s <= par + Math.max(2, Math.ceil(par * 0.5)) ? 2 : 1;
}
const totalStars = () => LEVELS.reduce((n, _, i) => n + (best[i] == null ? 0 : starsFor(i, best[i])), 0);

let winTimers = [], winShown = false;
function win() {
  won = true; hideTip(levelIndex === 0);
  held.length = 0; buffered = null;
  const prev = best[levelIndex], isBest = prev != null && pushes < prev;
  if (prev == null || pushes < prev) { best[levelIndex] = pushes; store.set('bestPushes', best); }
  winTimers.forEach(clearTimeout);
  const lv = levelIndex, later = (ms, fn) => winTimers.push(setTimeout(() => { if (won && levelIndex === lv) fn(); }, ms));
  later(250, () => {
    music.duck(2.5);
    sfx.win();
    player.actions.jump.reset().play(); player.spin = 1;
    crates.forEach((c, n) => setTimeout(() => { c.pop = 1; }, n * 90));
    confetti();
  });
  later(1300, () => {
    const st = starsFor(levelIndex, pushes), par = LEVELS[levelIndex].parPushes;
    $('winStars').innerHTML = [0, 1, 2].map((n) => `<svg class="i ${n < st ? 'on' : ''}"><use href="#i-star"/></svg>`).join('');
    const last = levelIndex === LEVELS.length - 1;
    $('winTitle').textContent = st === 3 ? ['Perfect!', 'Super star!', 'Amazing!'][levelIndex % 3] : ['Hooray!', 'You did it!', 'Well done!', 'Nice one!'][levelIndex % 4];
    $('winText').innerHTML = `All home in <b>${pushes}</b> ${pushes === 1 ? 'push' : 'pushes'}` + (isBest ? '<span class="newbest">New best!</span>' : '');
    $('winHint').textContent = last ? 'That was the last garden. You are a crate champion!' : st < 3 ? `Do it in ${par} ${par === 1 ? 'push' : 'pushes'} for 3 stars.` : 'That is the fewest pushes possible!';
    $('nextLabel').textContent = last ? 'Garden 1' : 'Next';
    $('winBox').hidden = false; winShown = true;
    $('nextBtn').focus({ preventScroll: true });
    for (let n = 0; n < st; n++) later(300 + n * 350, () => sfx.star(n));
  });
}

// ---------- effects ----------
const fx = [];
const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffe14a, fog: false });
const sparkMat2 = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
function sparkle(pos) {
  for (let n = 0; n < 16; n++) {
    const m = new THREE.Mesh(GEO.spark, n % 3 ? sparkMat : sparkMat2);
    m.position.copy(pos).add(new THREE.Vector3(0, 0.7, 0));
    const a = (n / 16) * Math.PI * 2, sp = 1.3 + Math.random() * 0.8;
    fx.push({ m, v: new THREE.Vector3(Math.cos(a) * sp, 2.5 + Math.random() * 1.8, Math.sin(a) * sp), life: 0.85 });
    world.add(m);
  }
  const ring = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({ color: 0xfff1a0, transparent: true, depthWrite: false, fog: false }));
  ring.position.set(pos.x, 0.03, pos.z); world.add(ring);
  fx.push({ m: ring, kind: 'ring', life: 0.55, max: 0.55, own: true });
}
function puff(pos, n) {
  if (reduceMotion) return;
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(GEO.puff, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthWrite: false }));
    m.position.set(pos.x + (Math.random() - 0.5) * 0.3, 0.06, pos.z + (Math.random() - 0.5) * 0.3); m.scale.setScalar(0.05);
    world.add(m); fx.push({ m, kind: 'puff', life: 0.45, max: 0.45, own: true, v: new THREE.Vector3((Math.random() - 0.5) * 0.5, 0.35, (Math.random() - 0.5) * 0.5) });
  }
}
const confMats = [0xff5f7a, 0xffbf1f, 0x39b85a, 0x4aa8ff, 0xb57bff, 0xffffff].map((c) => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, fog: false }));
function confetti() {
  if (reduceMotion) return;
  for (let n = 0; n < 140; n++) {
    const m = new THREE.Mesh(GEO.conf, confMats[n % confMats.length]);
    m.position.copy(player.obj.position).add(new THREE.Vector3(0, 1, 0));
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3.4;
    fx.push({ m, v: new THREE.Vector3(Math.cos(a) * s, 4 + Math.random() * 4.5, Math.sin(a) * s), life: 2.6, spin: new THREE.Vector3(Math.random() * 9, Math.random() * 9, 0), kind: 'conf' });
    world.add(m);
  }
}

// ---------- camera: fixed 45° tilt, free yaw, zoom ----------
const cam = { yaw: 0.35, targetYaw: 0.35, pitch: Math.PI / 4, zoom: 1, targetZoom: 1, fit: 8, lift: 0, focus: new THREE.Vector3() };
function turnView(sign) { cam.targetYaw = Math.round((cam.targetYaw + sign * Math.PI / 2) / (Math.PI / 4)) * (Math.PI / 4); }
function placeCamera(dt) {
  const k = 1 - Math.exp(-(intro < 1 ? 3.2 : 8) * dt);
  if (mode === 'title' && !reduceMotion) cam.targetYaw += dt * 0.12;
  cam.yaw += (cam.targetYaw - cam.yaw) * k;
  cam.zoom += (cam.targetZoom - cam.zoom) * k;
  const aspect = renderer.domElement.clientWidth / Math.max(1, renderer.domElement.clientHeight);
  const ext = Math.max(L.W, L.H) + 2.6;
  const r = Math.max(cam.fit * 1.52 + 3.8, ext / (0.64 * aspect)) * cam.zoom * (mode === 'title' ? 1.12 : 1);
  // follow the worker gently so big gardens stay in view
  const target = new THREE.Vector3().copy(player.obj.position).multiplyScalar(mode === 'title' ? 0 : 0.2);
  cam.focus.lerp(target, 1 - Math.exp(-3 * dt));
  camera.position.set(
    cam.focus.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * r,
    cam.focus.y + Math.sin(cam.pitch) * r,
    cam.focus.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * r);
  // when the win card is up, look a little lower so the party stays visible above it
  cam.lift += ((winShown ? 1 : 0) - cam.lift) * (1 - Math.exp(-4 * dt));
  camera.lookAt(cam.focus.x, cam.focus.y - 0.3 - r * (0.03 + 0.2 * cam.lift), cam.focus.z);
}

// ---------- main loop ----------
const clock = new THREE.Clock();
let t = 0;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;

  // the island floats up into place when a garden opens, then bobs very gently
  if (intro < 1) intro = Math.min(1, intro + dt / 0.9);
  world.position.y = -(1 - easeOut(intro)) * 5 + (reduceMotion ? 0 : Math.sin(t * 0.8) * 0.05);

  // motion along the grid rail; chain steps without stopping when a key is held
  let carry = 0;
  if (player.moving) {
    const m = player.moving;
    m.t += dt / m.dur;
    const s = Math.min(m.t, 1);
    player.rail.lerpVectors(m.from, m.to, s);
    if (m.crate) m.crate.obj.position.lerpVectors(m.crate.from, m.crate.to, s);
    if (m.t >= 1) { carry = (m.t - 1) * m.dur; finishMotion(); }
  }
  if (!player.moving && !won && mode === 'play') {
    const dir = buffered || held[held.length - 1];
    buffered = null;
    if (dir) tryStep(dir, carry > 0 ? Math.min(carry, 0.05) / STEP_TIME : 0);
  }

  // smooth follower: critically damped spring behind the rail, so starts and stops ease
  const w = 26, p = player.obj.position;
  const subs = Math.ceil(dt / (1 / 240)), h = dt / subs;
  for (let n = 0; n < subs; n++) {
    player.vel.x += ((player.rail.x - p.x) * w * w - 2 * w * player.vel.x) * h;
    player.vel.z += ((player.rail.z - p.z) * w * w - 2 * w * player.vel.z) * h;
    p.x += player.vel.x * h; p.z += player.vel.z * h;
  }
  const speed = Math.hypot(player.vel.x, player.vel.z);

  // bump into a wall: small lean and spring back
  let bumpOff = 0;
  if (player.bump) {
    player.bump.t += dt / 0.22;
    bumpOff = Math.sin(Math.min(player.bump.t, 1) * Math.PI) * 0.14;
    if (player.bump.t >= 1) player.bump = null;
  }
  player.body.position.set(player.bump ? player.bump.dx * bumpOff : 0, 0, player.bump ? player.bump.dy * bumpOff : 0);

  // turn smoothly to face the way we walk; a happy twirl on a win
  let dy = player.targetYaw - player.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  player.yaw += dy * (1 - Math.exp(-16 * dt));
  if (player.spin > 0) player.spin = Math.max(0, player.spin - dt / 0.9);
  player.obj.rotation.y = player.yaw + easeOut(1 - player.spin) * Math.PI * 2 * (player.spin > 0 ? 1 : 0);
  player.body.rotation.x = Math.min(speed / 5, 1) * 0.12 + (player.moving && player.moving.crate ? 0.12 : 0);

  // blend idle <-> walk by speed
  const wantWalk = speed > 0.4 ? 1 : 0;
  player.walkW += (wantWalk - player.walkW) * (1 - Math.exp(-12 * dt));
  player.actions.walk.setEffectiveWeight(player.walkW);
  player.actions.idle.setEffectiveWeight(1 - player.walkW);
  player.actions.walk.timeScale = 1.6;
  player.mixer.update(dt);

  // crates: drop in at the start, glow when home, little squash pop
  for (const c of crates) {
    let y = 0;
    if (c.drop > 0) {
      const before = c.drop; c.drop = Math.max(0, c.drop - dt / 0.55);
      const q = Math.min(c.drop, 1); y = q * q * 5;
      if (before > 0 && c.drop === 0) { c.pop = 0.5; if (mode === 'play') sfx.land(); puff(c.obj.position, 2); }
    }
    c.glow += ((c.onGoal ? 1 : 0) - c.glow) * (1 - Math.exp(-8 * dt));
    const pulse = c.glow * (0.16 + 0.08 * Math.sin(t * 3 + c.id));
    c.mat.emissive.setRGB(pulse, pulse * 0.75, pulse * 0.15);
    c.pop = Math.max(0, c.pop - dt * 2.5);
    const sq = Math.sin(c.pop * Math.PI) * 0.18;
    c.obj.scale.set(1 + sq * 0.5, 1 - sq * 0.6, 1 + sq * 0.5);
    c.obj.position.y = y + Math.sin(c.pop * Math.PI) * 0.25;
  }
  // pads: coins spin and hide under crates, rings breathe
  for (const p of pads) {
    p.coin.rotation.y += dt * 2.2;
    const target = p.filled ? 0 : 1;
    const s = p.coin.scale.x / 1.05;
    const ns = s + (target - s) * (1 - Math.exp(-10 * dt));
    p.coin.scale.setScalar(1.05 * Math.max(ns, 0.0001));
    p.coin.position.y = 0.52 + Math.sin(t * 2.4 + p.key) * 0.07;
    p.decal.scale.setScalar(1 + Math.sin(t * 3 + p.key) * 0.05);
    p.decal.rotation.y = t * 0.4;
  }
  for (const a of ambient) a.tick(t, dt);
  for (let n = fx.length - 1; n >= 0; n--) {
    const f = fx[n];
    f.life -= dt;
    if (f.kind === 'conf') { f.v.y -= 6 * dt; f.v.multiplyScalar(1 - 1.6 * dt); f.m.rotation.x += f.spin.x * dt; f.m.rotation.y += f.spin.y * dt; f.m.position.addScaledVector(f.v, dt); }
    else if (f.kind === 'ring') { const q = 1 - f.life / f.max; f.m.scale.setScalar(0.6 + q * 2.2); f.m.material.opacity = 1 - q; }
    else if (f.kind === 'puff') { const q = 1 - f.life / f.max; f.m.scale.setScalar(0.06 + q * 0.16); f.m.material.opacity = 0.7 * (1 - q); f.m.position.addScaledVector(f.v, dt); }
    else { f.v.y -= 9 * dt; f.m.rotation.y += 8 * dt; f.m.scale.setScalar(Math.max(0.01, f.life * 1.5)); f.m.position.addScaledVector(f.v, dt); }
    if (f.life <= 0) { world.remove(f.m); if (f.own) f.m.material.dispose(); fx.splice(n, 1); }
  }
  if (starField.visible) starField.material.opacity = 0.75 + Math.sin(t * 1.7) * 0.15;
  if (won && !reduceMotion) cam.targetYaw += dt * 0.1;

  placeCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- hints and banners ----------
let tipDone = store.get('tipDone', false), tipTimer = 0;
function showTip() {
  const el = $('tip'); clearTimeout(tipTimer);
  if (mode !== 'play' || tipDone || levelIndex !== 0) { el.hidden = true; return; }
  el.innerHTML = document.body.classList.contains('touch')
    ? 'Hold the <b>yellow arrows</b> to walk.<br>Push the crate onto the <b>star ring</b>!'
    : 'Walk with <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>.<br>Push the crate onto the <b>star ring</b>!';
  el.hidden = false; el.style.opacity = 1;
}
function hideTip(forGood) {
  const el = $('tip'); if (el.hidden) return;
  el.style.opacity = 0; tipTimer = setTimeout(() => (el.hidden = true), 700);
  if (forGood) { tipDone = true; store.set('tipDone', true); }
}
function showBanner() {
  const el = $('banner');
  $('bannerNum').textContent = `Garden ${levelIndex + 1} · ${theme.name}`; $('bannerName').textContent = LEVELS[levelIndex].name;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

// ---------- input ----------
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const busy = () => mode !== 'play' || !$('levelBox').hidden || !$('winBox').hidden;
function press(dir) {
  audio();
  if (busy()) return;
  if (!held.includes(dir)) held.push(dir);
  if (player.moving) buffered = dir; else tryStep(dir);
  if (steps > 2) hideTip(levelIndex === 0);
}
function release(dir) { const i = held.indexOf(dir); if (i >= 0) held.splice(i, 1); }

addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (mode === 'title' && $('levelBox').hidden) { if (!e.repeat && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); play(); } return; }
  const dir = KEYS[e.code];
  if (dir) { e.preventDefault(); if (!e.repeat) press(dir); return; }
  if (e.repeat) return;
  if (!$('levelBox').hidden) { if (e.code === 'Escape') closeLevels(); return; }
  if (!$('winBox').hidden) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); $('nextBtn').click(); } return; }
  if (e.code === 'KeyZ' || e.code === 'KeyU' || e.code === 'Backspace') { e.preventDefault(); undo(); }
  else if (e.code === 'KeyR') restart();
  else if (e.code === 'KeyM') setMusic(!musicOn);
  else if (e.code === 'KeyQ') turnView(-1);
  else if (e.code === 'KeyE') turnView(1);
  else if (e.code === 'Escape') openLevels();
});
addEventListener('keyup', (e) => { const dir = KEYS[e.code]; if (dir) release(dir); });
addEventListener('blur', () => { held.length = 0; });

document.querySelectorAll('#dpad button').forEach((b) => {
  const dir = b.dataset.dir;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add('down'); press(dir); });
  const up = () => { b.classList.remove('down'); release(dir); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
});
// show the on-screen arrows as soon as anyone touches the screen
if (matchMedia('(any-pointer: coarse)').matches) document.body.classList.add('touch');
addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch' && !document.body.classList.contains('touch')) { document.body.classList.add('touch'); showTip(); } }, { capture: true, passive: true });

// drag to orbit, wheel / pinch to zoom
const canvas = renderer.domElement;
const pointers = new Map(); let pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = cam.targetZoom; }
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (pointers.size === 1) {
    cam.targetYaw -= (e.clientX - p.x) * 0.008;
  } else if (pointers.size === 2) {
    p.x = e.clientX; p.y = e.clientY;
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0) cam.targetZoom = THREE.MathUtils.clamp(zoom0 * pinch0 / d, 0.6, 1.6);
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (!pointers.size) { canvas.classList.remove('dragging'); } };
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.targetZoom = THREE.MathUtils.clamp(cam.targetZoom * (1 + Math.sign(e.deltaY) * 0.1), 0.6, 1.6); }, { passive: false });

// ---------- screens ----------
function paintTitle() {
  const lv = Math.min(Math.max(0, store.get('level', 0)), LEVELS.length - 1);
  const started = Object.keys(best).length > 0 || lv > 0;
  $('playLabel').textContent = started ? `Play garden ${lv + 1}` : 'Play';
  $('titleStars').textContent = `${totalStars()} / ${LEVELS.length * 3}`;
}
function showTitle() {
  mode = 'title'; held.length = 0; paintTitle();
  document.body.classList.add('title'); $('titleBox').classList.remove('out');
  $('winBox').hidden = true; winShown = false; $('levelBox').hidden = true; showTip();
}
function play(level) {
  audio(); sfx.click();
  mode = 'play';
  document.body.classList.remove('title'); $('titleBox').classList.add('out');
  if (level != null && (level !== levelIndex || won || history.length)) buildLevel(level);
  else { showBanner(); showTip(); }
}
function restart() { if (busy()) return; buildLevel(levelIndex, { quick: true }); crates.forEach((c) => (c.pop = 0.5)); sfx.undo(); }
$('undoBtn').onclick = () => { audio(); undo(); };
$('restartBtn').onclick = () => { audio(); restart(); };
$('turnL').onclick = () => turnView(-1);
$('turnR').onclick = () => turnView(1);
$('soundBtn').onclick = toggleSound;
$('soundBtn2').onclick = toggleSound;
$('musicBtn').onclick = () => {
  if (!soundOn) { soundOn = true; store.set('sound', true); setMusic(true); }
  else setMusic(!musicOn);
  sfx.click();
};
$('playBtn').onclick = () => play();
$('nextBtn').onclick = () => { sfx.click(); buildLevel((levelIndex + 1) % LEVELS.length); };
$('replayBtn').onclick = () => { sfx.click(); buildLevel(levelIndex); };
function openLevels() {
  held.length = 0; sfx.click();
  $('gridStars').textContent = `${totalStars()} / ${LEVELS.length * 3}`;
  $('levelGrid').innerHTML = THEMES.map((th, z) => {
    const items = LEVELS.slice(z * 5, z * 5 + 5).map((lv, n) => {
      const i = z * 5 + n, b = best[i], st = b == null ? 0 : starsFor(i, b);
      return `<button data-i="${i}" class="btn ${b != null ? 'done' : ''} ${i === levelIndex ? 'cur' : ''}" aria-label="Garden ${i + 1}: ${lv.name}${b != null ? `, ${st} stars` : ''}">${i + 1}<span class="s">${[0, 1, 2].map((k) => `<svg class="i ${k < st ? 'on' : ''}"><use href="#i-star"/></svg>`).join('')}</span></button>`;
    }).join('');
    return `<div class="zone" style="--zbg:${th.ui.bg};--zc:${th.ui.c};--zdeep:${th.ui.deep};--zink:${th.ui.ink};--zlip:${th.ui.lip}"><h3>${th.name}${th.tag ? `<span>${th.tag}</span>` : ''}</h3><div class="grid">${items}</div></div>`;
  }).join('');
  $('levelBox').hidden = false;
}
function closeLevels() { $('levelBox').hidden = true; }
$('levelsBtn').onclick = openLevels;
$('titleLevels').onclick = () => { audio(); openLevels(); };
$('winLevels').onclick = openLevels;
$('closeLevels').onclick = () => { sfx.click(); closeLevels(); };
$('homeBtn').onclick = () => { sfx.click(); showTitle(); };
$('levelGrid').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; closeLevels(); play(+b.dataset.i); };
$('levelBox').addEventListener('pointerdown', (e) => { if (e.target === $('levelBox')) closeLevels(); });

// ---------- start ----------
async function start(saved) {
  paintAudio();
  try { await Promise.race([document.fonts.load('700 40px Fredoka'), new Promise((r) => setTimeout(r, 1500))]); } catch {}
  await loadModels();
  player = makePlayer();
  resize();
  const startLevel = Math.min(Math.max(0, saved.level ?? store.get('level', 0)), LEVELS.length - 1);
  const resume = saved.history && saved.level === startLevel;
  if (resume) { mode = 'play'; document.body.classList.remove('title'); }
  buildLevel(startLevel, { quick: resume });
  if (resume) { for (const h of saved.history) replay(h); } else showTitle();
  const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 500);
  clock.start();
  requestAnimationFrame(frame);
  window.__beep = { music, get audioState() { return actx ? actx.state : "none"; }, suspendAudio: () => actx.suspend(), tryStep, undo, buildLevel, play, showTitle, get state() { return { mode, level: levelIndex, gx: player.gx, gy: player.gy, steps, pushes, won, crates: crates.map((c) => c.key) }; }, cam, finishMotion };
}
function replay(h) {
  // re-apply a saved step (used when the page updates while someone is playing)
  const { W } = L; const tx = h.to % W, ty = (h.to / W) | 0;
  const dx = tx - player.gx, dy = ty - player.gy;
  const dir = ['up', 'down', 'left', 'right'].find((d) => { const [a, b] = screenDirToGrid(d); return a === dx && b === dy; });
  if (dir) { tryStep(dir); finishMotion(); }
}
document.body.classList.add('title');
window.claude?.hot?.snapshot?.(() => ({ level: levelIndex, history: mode === 'play' ? history.map((h, i) => ({ to: (history[i + 1]?.p ?? (player.gy * L.W + player.gx)) })) : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
